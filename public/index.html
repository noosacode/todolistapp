<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brisbane Gardens & Landscapes</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <h1>Jobs</h1>

    <!-- Login -->
    <div id="login-box">

        <input type="text" id="username" placeholder="Username">

        <input type="password" id="password" placeholder="Password">

        <button id="login-btn">Login</button>

        <button id="logout-btn" style="display: none;">
            Logout
        </button>

    </div>

    <hr>

    <!-- Jobs area -->
    <div id="jobs-area" style="display: none;">

        <p><a href="view-jobs.html">View other users' jobs</a></p>

        <h2>Add a Job</h2>

        <input type="text" id="title" placeholder="Title">

        <br><br>

        <textarea id="description" placeholder="Description" rows="4" cols="40"></textarea>

        <br><br>

        <button id="create-btn">
            Add Job
        </button>

        <h2>My Jobs</h2>

        <div id="jobs"></div>

    </div>

    <script src="js/login.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/jobs.js"></script>

</body>

</html>
